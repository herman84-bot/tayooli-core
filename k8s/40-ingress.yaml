apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tayooli-ingress
  namespace: tayooli-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          # API → Go backend (finance-service)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: finance-service
                port:
                  number: 8081
          # Everything else → Next.js frontend (tayooli-api)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tayooli-api
                port:
                  number: 3000
