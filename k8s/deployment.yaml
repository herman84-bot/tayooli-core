apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayooli-api
  namespace: tayooli-core
  labels:
    app.kubernetes.io/name: tayooli-api
    app.kubernetes.io/part-of: tayooli-erp
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tayooli-api
  template:
    metadata:
      labels:
        app: tayooli-api
    spec:
      # CI replaces ${IMAGE_TAG} with ${{ github.sha }} (see .github/workflows/ci.yml build job), e.g.:
      #   sed -i "s|\${IMAGE_TAG}|${GITHUB_SHA}|g" k8s/*.yaml
      containers:
        - name: tayooli-api
          image: gcr.io/luminaflow-prod/backend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: tayooli-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tayooli-api-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tayooli-api-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tayooli-api-secrets
                  key: JWT_SECRET
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: tayooli-api-secrets
                  key: SENTRY_DSN
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
