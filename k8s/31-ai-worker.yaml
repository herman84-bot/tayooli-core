apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: tayooli-core
  labels:
    app: ai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      containers:
        - name: worker
          image: gcr.io/luminaflow-prod/ai-worker:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: tayooli-config
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: tayooli-config
                  key: KAFKA_BROKERS_AI
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-worker
  namespace: tayooli-core
spec:
  selector:
    app: ai-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
