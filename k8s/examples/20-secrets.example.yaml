# Example secret manifest — DO NOT commit real values.
#
# This file lives in k8s/examples/ so `kubectl apply -f k8s/` (used by CI)
# does NOT apply it. Provision the real secret in CI with:
#
#   kubectl -n tayooli-core create secret generic tayooli-secrets \
#     --from-literal=DB_USER=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=SENTRY_DSN=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# or by an operator:
#
#   kubectl apply -f k8s/examples/20-secrets.example.yaml   # after editing
#
apiVersion: v1
kind: Secret
metadata:
  name: tayooli-secrets
  namespace: tayooli-core
type: Opaque
stringData:
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  SENTRY_DSN: ""
