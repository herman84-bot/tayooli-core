# Secret TEMPLATE — do NOT commit real values.
#
# Usage:
#   1. cp k8s/secret.yaml k8s/secret.local.yaml
#   2. Replace the base64 placeholders (values are base64 of the plain secret).
#      NOTE: the JWT_SECRET placeholder is intentionally a short "CHANGE_ME" so
#      config.Load's >= 32-char check fails fast if it is ever applied — and if
#      it ever WAS applied, rotate the JWT secret before real traffic. Generate
#      a real secret with: openssl rand -base64 48
#        echo -n "CHANGE_ME" | base64
#   3. Apply manually — NEVER via CI, and NEVER commit the filled file:
#        kubectl apply -f k8s/secret.local.yaml
#
# Alternative: kubectl create secret (same data, no file on disk):
#   kubectl create secret generic tayooli-api-secrets \
#     --namespace tayooli-core \
#     --from-literal=DB_USER=tayooli \
#     --from-literal=DB_PASSWORD=CHANGE_ME \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#     # JWT_SECRET must be >= 32 chars — config.Load rejects shorter values at startup.
apiVersion: v1
kind: Secret
metadata:
  name: tayooli-api-secrets
  namespace: tayooli-core
  labels:
    app.kubernetes.io/name: tayooli-api
    app.kubernetes.io/part-of: tayooli-erp
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Secret values are written as plain text here and encoded by Kubernetes on
  # apply. The DB user is split from the ConfigMap so credentials stay in one place.
  DB_USER: "tayooli"
  DB_PASSWORD: "CHANGE_ME"
  # WARNING: if this placeholder is ever applied, the JWT secret MUST be
  # rotated before real traffic — config.Load rejects values < 32 characters
  # at startup, but a placeholder that passes the length check would still be
  # a known, public secret. Rotate via: kubectl create secret ... then
  #  kubectl rollout restart deployment/tayooli-api.
  JWT_SECRET: "CHANGE_ME"
  # Optional: SENTRY_DSN: "https://key@o0.ingest.sentry.io/project"
