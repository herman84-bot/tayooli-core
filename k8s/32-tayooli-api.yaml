apiVersion: apps/v1
kind: Deployment
metadata:
  name: tayooli-api
  namespace: tayooli-core
  labels:
    app: tayooli-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tayooli-api
  template:
    metadata:
      labels:
        app: tayooli-api
    spec:
      containers:
        - name: web
          image: gcr.io/luminaflow-prod/frontend:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: tayooli-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tayooli-api
  namespace: tayooli-core
spec:
  selector:
    app: tayooli-api
  ports:
    - name: http
      port: 3000
      targetPort: http
