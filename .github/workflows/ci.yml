name: CI/CD

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  test-go:
    name: "Go Tests & Vet"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tayooli_test
          POSTGRES_USER: tayooli
          POSTGRES_PASSWORD: testpass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download Go modules
        run: go mod download
        working-directory: backend/go-core

      - name: Vet (static checks)
        run: go vet ./...
        working-directory: backend/go-core

      - name: Run database migrations
        run: |
          for f in backend/go-core/migrations/*.sql; do
            echo "Applying: $(basename $f)"
            PGPASSWORD=testpass psql -h localhost -U tayooli -d tayooli_test -f "$f" || true
          done

      - name: Run Go tests
        run: go test -v ./...
        working-directory: backend/go-core
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: tayooli
          DB_PASSWORD: testpass
          DB_NAME: tayooli_test
          DB_SSLMODE: disable
          JWT_SECRET: test-secret-32-chars-long-for-ci-only!!!

  test-frontend:
    name: "Frontend Typecheck & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --passWithNoTests
